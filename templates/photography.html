{% extends "base.html" %}

{% block content %}
{% for photo in page.extra.photos %}
<figure tabindex="0">
  <img class="gallery-img"
       src="/photography/{{ photo.file }}"
       alt="{{ photo.caption }} | {{ photo.year }}"
       loading="lazy">
  <figcaption>{{ photo.caption }}, {{ photo.year }}</figcaption>
</figure>
{% endfor %}
<div class="backdrop"></div>
{% endblock content %}
